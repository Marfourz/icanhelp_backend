services:
  web:
    build: .
    volumes:
      - .:/app
      # Masque le .env de prod (bind-monté via la ligne ci-dessus) avec un fichier vide :
      # settings.py fait load_dotenv() sans chemin explicite, qui cherche/charge le
      # premier .env trouvé — sans ça, il complète en silence ENVIRONMENT/R2_* etc.
      # avec les valeurs de prod pour tout ce que .env.local ne définit pas lui-même.
      - ./.env.container-empty:/app/.env:ro
    ports:
      - '8001:8000'
    env_file: 
     - .env.local
    depends_on:
      db:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    entrypoint: /app/entrypoint.sh

  db:
    env_file:
     - .env.local
    image: mysql:8.4
    container_name: icanhelp_db
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    env_file:
     - .env.local
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    env_file:
     - .env.local
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD && mc mb local/$$MINIO_BUCKET --ignore-existing && mc anonymous set public local/$$MINIO_BUCKET"]

  db-adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # UI web (http://localhost:8025)

volumes:
  mysql_data:
  minio_data: